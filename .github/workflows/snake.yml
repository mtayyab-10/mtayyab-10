name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=34d399&color_dots=161b22,064e3b,047857,10b981,34d399
            dist/github-snake.svg?color_snake=0b0f14&color_dots=ebedf0,a7f3d0,6ee7b7,10b981,059669

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b output
          git add .
          git commit -q -m "update snake"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
