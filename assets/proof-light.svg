<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Best Open-Source AI Project at HacktoberFest '26. Founder of Devixaweb since December 2024. Two papers published on Zenodo, September 2026. Educator of global cohorts aged 8 to 12." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#059669" stroke-opacity=".06"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="898" height="128" rx="14"/></clipPath>
</defs>
<style>
.f { font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
.pulse { animation:pu 2.4s ease-in-out infinite; }
@keyframes pu { 0%,100% { opacity:.3; } 50% { opacity:1; } }
.rise { opacity:0; animation:ri .8s ease-out forwards; }
@keyframes ri { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
</style>
<rect x="1" y="1" width="898" height="128" rx="14" fill="#f8fafc" stroke="#059669" stroke-opacity=".35"/>
<g clip-path="url(#card)"><rect width="900" height="130" fill="url(#grid)"/></g>
<g class="f"><g class="rise" style="animation-delay:0.0s"><circle cx="26" cy="26" r="2.6" fill="#059669" class="pulse" style="animation-delay:0.0s"/><text x="26" y="50" font-size="15" font-weight="700" fill="#0b0f14">Best Open-Source</text><text x="26" y="70" font-size="15" font-weight="700" fill="#0b0f14">AI Project</text><text x="26" y="92" font-size="11.5" fill="#64748b">HacktoberFest '26</text></g><g class="rise" style="animation-delay:0.25s"><circle cx="251" cy="26" r="2.6" fill="#059669" class="pulse" style="animation-delay:0.25s"/><text x="251" y="50" font-size="15" font-weight="700" fill="#0b0f14">Founder</text><text x="251" y="92" font-size="11.5" fill="#64748b">Devixaweb, since</text><text x="251" y="107" font-size="11.5" fill="#64748b">December 2024</text></g><line x1="225" y1="18" x2="225" y2="112" stroke="#d7dee6"/><g class="rise" style="animation-delay:0.5s"><circle cx="476" cy="26" r="2.6" fill="#059669" class="pulse" style="animation-delay:0.5s"/><text x="476" y="50" font-size="15" font-weight="700" fill="#0b0f14">Two papers</text><text x="476" y="92" font-size="11.5" fill="#64748b">Published on Zenodo,</text><text x="476" y="107" font-size="11.5" fill="#64748b">September 2026</text></g><line x1="450" y1="18" x2="450" y2="112" stroke="#d7dee6"/><g class="rise" style="animation-delay:0.75s"><circle cx="701" cy="26" r="2.6" fill="#059669" class="pulse" style="animation-delay:0.75s"/><text x="701" y="50" font-size="15" font-weight="700" fill="#0b0f14">Educator</text><text x="701" y="92" font-size="11.5" fill="#64748b">Global cohorts,</text><text x="701" y="107" font-size="11.5" fill="#64748b">ages 8 to 12</text></g><line x1="675" y1="18" x2="675" y2="112" stroke="#d7dee6"/></g>
</svg>
